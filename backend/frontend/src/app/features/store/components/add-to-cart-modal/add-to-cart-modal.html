<div class="modal-overlay" *ngIf="isOpen" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Agregar al Carrito</h3>
      <button class="close-btn" (click)="closeModal()" [disabled]="isLoading">&times;</button>
    </div>
    <div class="modal-body" *ngIf="product">
      <div class="product-summary">
        <div class="product-image">
          <img [src]="product.img_Url || 'https://via.placeholder.com/100x100'" [alt]="product.modelo" />
        </div>
        <div class="product-details">
          <h4>{{ product.modelo }}</h4>
          <p class="price">${{ product.costo_m2 | number:'1.2-2' }}/m²</p>
          <p class="description" *ngIf="product.descripcion">{{ product.descripcion }}</p>
        </div>
      </div>

      <div class="quantity-section">
        <label for="quantity">Cantidad:</label>
        <div class="quantity-controls">
          <button type="button" class="quantity-btn" (click)="decreaseQuantity()" [disabled]="quantity <= 1 || isLoading">-</button>
          <input type="number" id="quantity" [(ngModel)]="quantity" min="1" max="999" class="quantity-input" [disabled]="isLoading" />
          <button type="button" class="quantity-btn" (click)="increaseQuantity()" [disabled]="isLoading">+</button>
        </div>
      </div>

      <div class="form-group">
        <label for="alto">Alto (m):</label>
        <input type="number" id="alto" [(ngModel)]="alto" min="0.01" step="0.01" [disabled]="isLoading" required />
      </div>
      <div class="form-group">
        <label for="ancho">Ancho (m):</label>
        <input type="number" id="ancho" [(ngModel)]="ancho" min="0.01" step="0.01" [disabled]="isLoading" required />
      </div>

      <div class="order-summary">
        <div class="summary-row">
          <span>Precio unitario:</span>
          <span>${{ product.costo_m2 | number:'1.2-2' }}</span>
        </div>
        <div class="summary-row">
          <span>Cantidad:</span>
          <span>{{ quantity }}</span>
        </div>
        <div class="summary-row total">
          <span><strong>Total:</strong></span>
          <span><strong>${{ (product.costo_m2 * quantity * alto * ancho) | number:'1.2-2' }}</strong></span>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="closeModal()" [disabled]="isLoading">Cancelar</button>
      <button type="button" class="btn btn-primary" (click)="addToCart()" [disabled]="isLoading || quantity < 1 || alto <= 0 || ancho <= 0">
        <span *ngIf="!isLoading"><i class="fas fa-cart-plus"></i> Agregar al Carrito</span>
        <span *ngIf="isLoading"><i class="fas fa-spinner fa-spin"></i> Agregando...</span>
      </button>
    </div>
  </div>
</div>
